# Timings compressed so the lab runs quickly. Production defaults are far longer
# (60s startup grace, 30s grouping, 5m dedup).
logLevel: debug
startupGraceSeconds: 5
resolveAfterSeconds: 10
reconcileSeconds: 10

suppression:
  groupWindowSeconds: 2
  dedupWindowSeconds: 60
  crashLoopRenotifySeconds: 3600
  minSeverity: warning

memoryRestarts:
  enabled: true
  pollSeconds: 3

content:
  logLines: 10

channels:
  collector:
    type: webhook
    url: http://127.0.0.1:9099/alert

routes:
  - match: {}
    channels: [collector]
